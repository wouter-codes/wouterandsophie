<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="coming-soon-content">
            <div class="emoji-animation">🚀</div>
            <h1>Coming Soon!</h1>
            <p class="subtitle">Something amazing is on the way</p>
            <p class="description">We're working hard to bring you an extraordinary experience. Stay tuned!</p>
            
            <form class="email-signup" method="post" action="#">
                <input 
                    type="email" 
                    name="email" 
                    placeholder="Enter your email to be notified" 
                    required
                >
                <button type="submit">Notify Me</button>
            </form>
        </div>
    </div>
</body>
</html>
